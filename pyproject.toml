[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcoc"
version = "0.1.0"
description = "Proyecto del curso basado en desarrollo asistido por agentes de IA"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
mcoc = "mcoc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
